<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MinLish - Tạo bộ từ mới</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Nunito:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#000f5d",
                        "on-tertiary": "#ffffff",
                        "primary": "#183ce6",
                        "error": "#EF4444",
                        "surface-variant": "#e0e0ff",
                        "on-secondary-container": "#007261",
                        "tertiary": "#4146bc",
                        "on-primary-container": "#f1f0ff",
                        "surface-tint": "#2848ee",
                        "surface-container-highest": "#e0e0ff",
                        "surface-dim": "#d5d7ff",
                        "inverse-surface": "#2b2e4d",
                        "card-dark": "#1A1D3B",
                        "secondary-fixed-dim": "#44ddc1",
                        "surface-container-low": "#f4f2ff",
                        "on-tertiary-fixed-variant": "#3135ac",
                        "surface-bright": "#fbf8ff",
                        "primary-fixed": "#dee0ff",
                        "on-primary": "#ffffff",
                        "success": "#10B981",
                        "tertiary-fixed-dim": "#bfc1ff",
                        "divider": "#E5E7EB",
                        "surface-dark": "#0031CA",
                        "surface-light": "#F8F9FF",
                        "tertiary-container": "#5b60d6",
                        "on-secondary-fixed-variant": "#005145",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#bbc3ff",
                        "on-secondary-fixed": "#00201a",
                        "primary-container": "#3d5afe",
                        "background": "#fbf8ff",
                        "surface-container-high": "#e6e6ff",
                        "surface": "#fbf8ff",
                        "on-tertiary-fixed": "#03006d",
                        "on-background": "#161937",
                        "outline": "#757688",
                        "tertiary-fixed": "#e1e0ff",
                        "primary-dark": "#0031CA",
                        "card-light": "#FFFFFF",
                        "secondary-container": "#68fadd",
                        "on-surface-variant": "#444656",
                        "inverse-primary": "#bbc3ff",
                        "on-primary-fixed-variant": "#002ccd",
                        "outline-variant": "#c5c5d9",
                        "warning": "#F59E0B",
                        "on-tertiary-container": "#f2efff",
                        "on-secondary": "#ffffff",
                        "subtle-text": "#6B7280",
                        "on-surface": "#161937",
                        "inverse-on-surface": "#f1efff",
                        "secondary": "#006b5c",
                        "on-error": "#ffffff",
                        "surface-container": "#edecff",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#68fadd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "32px",
                        "margin-screen": "16px",
                        "element-gap": "12px",
                        "group-gap": "24px",
                        "base-unit": "4px"
                    },
                    "fontFamily": {
                        "headline-md": ["Nunito"],

                    "fontSize": {

                        "button": ["15px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "700"}],
                        "body-base": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "display-word": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "800"}]

                },
            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        body {
            background-color: #fbf8ff;
            color: #161937;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .drag-handle {
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen pb-24">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-divider flex items-center justify-between h-16 px-4">
<div class="flex items-center gap-3">
<button class="p-2 active:opacity-80 transition-opacity hover:bg-surface-container-high rounded-full">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Tạo bộ từ mới</h1>
</div>
<button class="px-4 py-2 text-primary font-button text-button hover:bg-primary-fixed/30 rounded-lg transition-colors">
            Lưu
        </button>
</header>
<main class="pt-20 px-4 max-w-2xl mx-auto">
<!-- Form Details Section -->
<section class="space-y-group-gap mb-section-gap">
<div class="space-y-element-gap">
<label class="block font-body-md text-body-md text-on-surface-variant px-1">Tên bộ từ</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/60" placeholder="Ví dụ: IELTS Vocabulary 7.5+" type="text"/>
</div>
<div class="space-y-element-gap">
<label class="block font-body-md text-body-md text-on-surface-variant px-1">Mô tả (không bắt buộc)</label>
<textarea class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/60 resize-none" placeholder="Ghi chú về bộ từ này..." rows="3"></textarea>
</div>
<div class="space-y-element-gap">
<label class="block font-body-md text-body-md text-on-surface-variant px-1">Chủ đề</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-1.5 rounded-full bg-primary-container text-on-primary-container text-caption font-medium border border-transparent hover:bg-primary transition-colors">IELTS</button>
<button class="px-4 py-1.5 rounded-full bg-divider text-on-surface-variant text-caption font-medium hover:bg-outline-variant transition-colors">TOEIC</button>
<button class="px-4 py-1.5 rounded-full bg-divider text-on-surface-variant text-caption font-medium hover:bg-outline-variant transition-colors">Business</button>
<button class="px-4 py-1.5 rounded-full bg-divider text-on-surface-variant text-caption font-medium hover:bg-outline-variant transition-colors">Academic</button>
<button class="px-4 py-1.5 rounded-full border border-dashed border-outline text-outline hover:bg-surface-container-high transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-sm">add</span>
<span class="text-caption">Thêm nhãn</span>
</button>
</div>
</div>
</section>
<!-- Vocabulary Section Header -->
<div class="flex items-center justify-between mb-element-gap sticky top-16 bg-background/90 backdrop-blur-md py-4 z-40">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Từ vựng (3 từ)</h2>
<button class="flex items-center gap-2 px-3 py-1.5 text-primary bg-primary-fixed/20 hover:bg-primary-fixed/40 rounded-lg transition-colors group">
<span class="material-symbols-outlined text-[18px]">upload_file</span>
<span class="font-button text-caption">Import CSV</span>
</button>
</div>
<!-- Word List -->
<div class="space-y-4" id="word-list">
<!-- Word Card 1 -->
<div class="group relative bg-card-light p-4 rounded-xl shadow-sm border border-divider hover:shadow-md transition-all">
<div class="flex items-start gap-3">
<div class="drag-handle p-1 text-outline-variant group-hover:text-outline transition-colors mt-2">
<span class="material-symbols-outlined">drag_indicator</span>
</div>
<div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<input class="w-full bg-transparent border-b border-transparent focus:border-primary focus:ring-0 text-headline-sm font-headline-sm p-0 transition-all" placeholder="Từ vựng" type="text" value="Resilient"/>
<p class="text-caption text-outline">THUẬT NGỮ</p>
</div>
<div class="space-y-1">
<input class="w-full bg-transparent border-b border-transparent focus:border-primary focus:ring-0 text-body-md font-body-md p-0 transition-all" placeholder="Định nghĩa" type="text" value="Kiên cường, có khả năng phục hồi nhanh"/>
<p class="text-caption text-outline">ĐỊNH NGHĨA</p>
</div>
</div>
<button class="p-2 text-outline-variant hover:text-error hover:bg-error-container/20 rounded-full transition-all">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<!-- Word Card 2 -->
<div class="group relative bg-card-light p-4 rounded-xl shadow-sm border border-divider hover:shadow-md transition-all">
<div class="flex items-start gap-3">
<div class="drag-handle p-1 text-outline-variant group-hover:text-outline transition-colors mt-2">
<span class="material-symbols-outlined">drag_indicator</span>
</div>
<div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<input class="w-full bg-transparent border-b border-transparent focus:border-primary focus:ring-0 text-headline-sm font-headline-sm p-0 transition-all" placeholder="Từ vựng" type="text" value="Prolific"/>
<p class="text-caption text-outline">THUẬT NGỮ</p>
</div>
<div class="space-y-1">
<input class="w-full bg-transparent border-b border-transparent focus:border-primary focus:ring-0 text-body-md font-body-md p-0 transition-all" placeholder="Định nghĩa" type="text" value="Hiệu suất cao, sáng tác nhiều"/>
<p class="text-caption text-outline">ĐỊNH NGHĨA</p>
</div>
</div>
<button class="p-2 text-outline-variant hover:text-error hover:bg-error-container/20 rounded-full transition-all">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<!-- Word Card 3 (Active Focus Example) -->
<div class="group relative bg-card-light p-4 rounded-xl shadow-[0_2px_10px_rgba(61,90,254,0.1)] border-2 border-primary transition-all">
<div class="flex items-start gap-3">
<div class="drag-handle p-1 text-primary mt-2">
<span class="material-symbols-outlined">drag_indicator</span>
</div>
<div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<input class="w-full bg-transparent border-b border-primary focus:ring-0 text-headline-sm font-headline-sm p-0" placeholder="Từ vựng" type="text" value="Ubiquitous"/>
<p class="text-caption text-primary">THUẬT NGỮ</p>
</div>
<div class="space-y-1">
<input class="w-full bg-transparent border-b border-divider focus:border-primary focus:ring-0 text-body-md font-body-md p-0" placeholder="Định nghĩa" type="text" value="Có mặt ở khắp mọi nơi"/>
<p class="text-caption text-outline">ĐỊNH NGHĨA</p>
</div>
</div>
<button class="p-2 text-outline-variant hover:text-error hover:bg-error-container/20 rounded-full transition-all">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<!-- Add New Word Button -->
<button class="w-full py-8 mt-4 border-2 border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center gap-2 text-outline-variant hover:border-primary hover:text-primary hover:bg-primary-fixed/10 transition-all group">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">add</span>
</div>
<span class="font-button text-button">+ Thêm từ mới</span>
</button>
</div>
</main>
<!-- Interactive Layer: Simple Scroll Indicator Shadow for Sticky Header -->
<script>
        const scrollHeader = document.querySelector('.sticky');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 200) {
                scrollHeader.classList.add('shadow-sm');
                scrollHeader.classList.remove('bg-background/90');
                scrollHeader.classList.add('bg-white');
            } else {
                scrollHeader.classList.remove('shadow-sm');
                scrollHeader.classList.add('bg-background/90');
                scrollHeader.classList.remove('bg-white');
            }
        });

        // Simple mock for "Add new word" click effect
        const addBtn = document.querySelector('.group.border-dashed');
        addBtn.addEventListener('click', () => {
            addBtn.style.transform = 'scale(0.98)';
            setTimeout(() => {
                addBtn.style.transform = 'scale(1)';
            }, 100);
        });
    </script>
</body></html>
